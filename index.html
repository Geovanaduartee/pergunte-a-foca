<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pergunte à foca</title>

    <style>
        button {
            background-color: purple;
        }

        body {
            background-color: #800080;
            text-align: center;
        }
    </style>

</head>
<body>

    <h1>Pergunte à foca</h1>

    <img height=380px src="https://images.unsplash.com/photo-1550399504-8953e1a6ac87?auto=format&fit=crop&w=800&q=80" alt="foca">

    <div>
        <input type="text" class="input1"> ou <input type="text" class="input2">
    </div>

    <button type="button" onclick="nomeDaFuncao()"> Perguntar </button>

    <script>

        function nomeDaFuncao(){

            var escolha = Math.floor(Math.random() * 10);

            if (escolha%2)
                alert("A foca escolheu "+document.querySelector(".input1").value)
            else
                alert("A foca escolheu "+document.querySelector(".input2").value)

        }

    </script>

</body>
</html>
